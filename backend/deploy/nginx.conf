server {
    listen 80;
    server_name _;

    # /api 요청만 FastAPI 백엔드로 프록시한다.
    # 프론트엔드(Next.js)는 별도 포트/컨테이너에서 서빙되며 이 nginx는 백엔드 전용이다.
    location /api/ {
        proxy_pass http://chemistry-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 시크릿이 담긴 Authorization 헤더/쿠키를 그대로 전달한다.
        proxy_pass_request_headers on;
    }

    location = /api/health {
        proxy_pass http://chemistry-backend:8000/api/health;
    }
}
