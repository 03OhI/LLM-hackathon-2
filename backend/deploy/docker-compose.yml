version: "3.8"

services:
  chemistry-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: chemistry-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - chemistry-data:/data
    environment:
      # SQLite 파일을 named volume에 저장해 재빌드 시 보존한다 (SPEC §10.2).
      - DATABASE_URL=sqlite:////data/chemistry.db
    expose:
      - "8000"
    # AWS Access Key를 여기 넣지 않는다. EC2 인스턴스 프로파일의 기본 자격 증명 체인을 사용한다.

  chemistry-nginx:
    image: nginx:1.27-alpine
    container_name: chemistry-nginx
    restart: unless-stopped
    depends_on:
      - chemistry-backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  chemistry-data:
