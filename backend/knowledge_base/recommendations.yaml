# 권장 행동 코드 정의
# caution_code에 매핑되는 구체적 실천 행동

recommendations:
  - code: FACT_IMPACT_REQUEST
    caution_code: CHECK_FEEDBACK_TONE
    text: "사실-영향-요청 순서로 말해 보세요."
    detail: "피드백을 줄 때 (1)관찰한 사실, (2)그로 인한 영향, (3)구체적 요청 순으로 구성하면 상대의 방어 반응을 줄일 수 있어요."

  - code: PAUSE_BEFORE_PUSH
    caution_code: CHECK_PACE_PRESSURE
    text: "결정을 밀어붙이기 전에 30초 멈추고 팀의 반응을 확인해 보세요."
    detail: "추진력이 장점이지만, 팀원들이 따라올 준비가 됐는지 확인하면 저항이 줄어들어요."

  - code: OPEN_TO_DETOUR
    caution_code: CHECK_FLEXIBILITY_EXPECTATION
    text: "계획에서 벗어난 아이디어가 나오면 3분간 자유 논의 시간을 줘 보세요."
    detail: "계획 변경을 허용하는 명시적 시간이 있으면 팀원들이 더 편하게 제안할 수 있어요."

  - code: SOFTEN_OPENING
    caution_code: CHECK_CONFRONTATION_LEVEL
    text: "문제를 제기할 때 '나는 ~라고 느꼈어'로 시작해 보세요."
    detail: "나-전달법을 쓰면 상대를 공격하는 느낌을 줄이면서도 핵심을 전달할 수 있어요."

  - code: CLAIM_AGENDA_SLOT
    caution_code: CHECK_VOICE_OPPORTUNITY
    text: "미팅 시작 전에 안건 하나를 미리 공유해 보세요."
    detail: "사전에 안건을 등록하면 발언 기회가 구조적으로 확보되어 목소리를 낼 수 있어요."

  - code: SHARE_PROGRESS_EARLY
    caution_code: CHECK_STRUCTURE_EXPECTATION
    text: "중간 진행 상황을 짧은 메시지로 먼저 공유해 보세요."
    detail: "완성 전이라도 진행 상황을 공유하면 계획형 팀원의 불안을 줄일 수 있어요."

  - code: STATE_NEEDS_EARLY
    caution_code: CHECK_ASSERTION_LEVEL
    text: "논의 초반에 '나는 ~가 필요해'라고 먼저 말해 보세요."
    detail: "필요한 것을 먼저 표현하면 나중에 불만이 쌓이는 것을 예방할 수 있어요."

  - code: NAME_ONE_CONCERN
    caution_code: CHECK_AVOIDANCE_RISK
    text: "회의가 끝나기 전에 우려 사항 하나만 명확히 말해 보세요."
    detail: "전체 갈등을 다루지 않아도 하나의 우려를 말하는 것으로 회피 패턴을 깰 수 있어요."
