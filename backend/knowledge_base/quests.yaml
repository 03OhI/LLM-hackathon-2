# 퀘스트 카탈로그 (아이스브레이커 미션)
#
# scope: TEAM   — 세션의 팀 전체가 공유하는 미션. 팀원 누구나 완료 처리 가능.
# scope: PERSONAL — 참여자 개인에게 배정되는 아이스브레이커 행동 제안.
#
# when 조건 문법은 기존 지식베이스와 동일하게 맞춘다:
# - TEAM: team_rules.yaml과 동일한 { axis, condition } 형태
#   (condition: balanced|majority_upper|majority_lower|all_upper|all_lower|has_upper|has_lower|no_upper|no_lower)
# - PERSONAL: private_insight_rules.yaml과 동일한 self.<axis>: <POSITION>,
#   team.<axis>.majority: <POSITION> 형태 (여러 키를 주면 AND 조건)
#
# quest_code는 안정적 식별자 — QuestAssignment DB row가 이 값을 참조한다.
# 문항 텍스트는 오프라인 생성 스크립트(ai/generate_quests.py)로 대량 생성/교체 가능하도록
# 형식을 고정해 둔다 (title/description/action 3필드 + tags).
#
# 이 초기 버전은 실제 Bedrock 호출 없이 수기로 작성한 스타터 세트다.
# 추후 ai/generate_quests.py 실행 결과로 각 scope 섹션을 확장하거나 교체하면 된다.

version: "v1-starter"

# ──────────────────────────────────────────────
# 팀 공유 퀘스트
# ──────────────────────────────────────────────

team_quests:
  - quest_code: TEAM_Q_BALANCED_AGENCY
    when:
      axis: agency
      condition: balanced
    title: "주도-지원 핑퐁 라운드"
    description: "이번 미팅에서 주도형과 지원형이 번갈아 첫 발언을 시작해보세요."
    action: "다음 논의 주제는 지원형 팀원이 먼저 운을 떼고, 주도형 팀원이 이어받아 정리해보기"
    tags: [agency, icebreaker]

  - quest_code: TEAM_Q_BALANCED_CONFLICT
    when:
      axis: conflict
      condition: balanced
    title: "다른 의견 한 스푼 추가하기"
    description: "직면형과 조화형이 섞인 팀입니다. 의견이 갈릴 만한 주제를 하나 골라 짧게 다뤄보세요."
    action: "회의 중 '나는 다르게 생각해'라는 말을 한 번씩 꺼내보고 어떻게 흘러가는지 관찰하기"
    tags: [conflict, icebreaker]

  - quest_code: TEAM_Q_DIVERSE_COMMUNICATION
    when:
      axis: communication
      condition: balanced
    title: "말하기 스타일 소개 타임"
    description: "직설형과 배려형이 함께 있는 팀입니다. 각자 선호하는 피드백 방식을 한 문장씩 공유해보세요."
    action: "'나는 이런 식으로 피드백 받는 게 편해'를 팀원 전원이 한 문장씩 말해보기"
    tags: [communication, icebreaker]

  - quest_code: TEAM_Q_PLANNING_MAJORITY
    when:
      axis: planning
      condition: majority_upper
    title: "즉흥 브레이크 타임"
    description: "계획형이 다수인 팀입니다. 5분만 계획 없이 자유롭게 아이디어를 던져보세요."
    action: "타이머 5분, 어떤 아이디어든 평가 없이 던지기만 하는 라운드 진행하기"
    tags: [planning, mission]

  - quest_code: TEAM_Q_ADAPTER_PRESENT
    when:
      axis: planning
      condition: has_lower
    title: "플랜 B 담당 지명하기"
    description: "적응형 팀원이 있습니다. 오늘 회의에서 '플랜 B는 내가 맡을게' 역할을 자원받아보세요."
    action: "예상 밖 상황이 생기면 누가 대안을 제안할지 미리 한 명 정해두기"
    tags: [planning, mission]

  - quest_code: TEAM_Q_DRIVER_ENERGY
    when:
      axis: agency
      condition: has_upper
    title: "첫 삽 뜨기 챌린지"
    description: "추진력 있는 팀원이 있습니다. 오늘 논의된 것 중 하나를 회의가 끝나기 전에 실제로 시작해보세요."
    action: "회의 종료 전 아이디어 하나를 골라 담당자를 정하고 첫 액션을 그 자리에서 실행하기"
    tags: [agency, mission]

  - quest_code: TEAM_Q_HARMONIZER_PRESENT
    when:
      axis: conflict
      condition: has_lower
    title: "온도 체크 타임"
    description: "조화형 팀원이 있습니다. 회의 중간에 '지금 다들 괜찮아?' 라고 한번 물어보게 해보세요."
    action: "회의 중간 지점에서 1분간 각자 컨디션이나 의견을 짧게 나누는 시간 갖기"
    tags: [conflict, mission]

  - quest_code: TEAM_Q_TACTFUL_PRESENT
    when:
      axis: communication
      condition: has_lower
    title: "돌려 말하기 번역 타임"
    description: "배려형 팀원이 있습니다. 그 팀원의 부드러운 제안을 다른 팀원이 한 문장으로 명확하게 재정리해주는 걸 해보세요."
    action: "누군가 조심스럽게 말한 의견을 다른 팀원이 '그러니까 이런 뜻이지?' 로 요약해주기"
    tags: [communication, mission]

  - quest_code: TEAM_Q_DIRECT_CONCENTRATION
    when:
      axis: communication
      condition: majority_upper
    title: "칭찬 먼저, 의견 나중"
    description: "직설형이 다수인 팀입니다. 피드백을 줄 때 좋은 점 한 가지를 먼저 말하는 규칙을 이번 회의에만 적용해보세요."
    action: "의견을 말하기 전에 상대 아이디어의 좋은 점 한 줄을 먼저 짚어주기"
    tags: [communication, mission]

  - quest_code: TEAM_Q_CONFRONTER_MAJORITY
    when:
      axis: conflict
      condition: majority_upper
    title: "숨 고르기 라운드"
    description: "직면형이 다수인 팀입니다. 열띤 논의 후 잠깐 침묵 10초를 가져보는 걸 시도해보세요."
    action: "의견이 부딜힐 때 바로 반박하지 않고 10초 침묵 후 다시 말하기 규칙 적용해보기"
    tags: [conflict, mission]

  - quest_code: TEAM_Q_LOW_DRIVER
    when:
      axis: agency
      condition: no_upper
    title: "이번엔 내가 스타터"
    description: "추진형이 없는 팀입니다. 팀원 중 한 명이 이번 한 번만 '시작 담당'을 자원해보세요."
    action: "오늘 회의에서 다음 액션 아이템을 누가 먼저 실행할지 한 명을 정해서 알려주기"
    tags: [agency, mission]

  - quest_code: TEAM_Q_PLANNING_OVERLOAD
    when:
      axis: planning
      condition: all_upper
    title: "완벽하지 않아도 공유하기"
    description: "전원 계획형인 팀입니다. 아직 다 정리되지 않은 아이디어를 그냥 던져보는 것도 시도해보세요."
    action: "'아직 정리 안 됐지만' 이라는 말을 붙이고 미완성 아이디어를 하나씩 공유해보기"
    tags: [planning, mission]

# ──────────────────────────────────────────────
# 개인 아이스브레이커 퀘스트
# ──────────────────────────────────────────────

personal_quests:
  - quest_code: PERSONAL_Q_PLANNER_SHARE_PLAN
    when:
      self.planning: PLANNER
    title: "내 계획 한 줄 공유"
    description: "머릿속에 있는 다음 단계 계획을 팀에게 한 문장으로 공유해보세요."
    action: "'나는 이렇게 진행하면 좋을 것 같아'를 한 문장으로 팀 채팅이나 회의에서 말해보기"
    tags: [planning, self]

  - quest_code: PERSONAL_Q_ADAPTER_TRY_DETOUR
    when:
      self.planning: ADAPTER
    title: "예상 밖 제안 하나"
    description: "원래 계획과 다른 방향의 아이디어를 하나 던져보세요."
    action: "회의 중 '완전 다른 방법이긴 한데'로 시작하는 제안 하나 해보기"
    tags: [planning, self]

  - quest_code: PERSONAL_Q_DRIVER_FIRST_MOVE
    when:
      self.agency: DRIVER
    title: "먼저 움직여보기"
    description: "누군가 시작하길 기다리지 말고, 오늘 논의된 작은 작업 하나를 먼저 시작해보세요."
    action: "회의 끝나고 5분 안에 담당할 작업 하나를 정해서 팀에 공유하기"
    tags: [agency, self]

  - quest_code: PERSONAL_Q_SUPPORTER_VOICE_IDEA
    when:
      self.agency: SUPPORTER
    title: "내 의견 한 마디"
    description: "평소보다 한 번 더, 내 아이디어를 짧게라도 먼저 꺼내보세요."
    action: "다음 논의에서 남이 묻기 전에 내 생각을 한 문장으로 먼저 말해보기"
    tags: [agency, self]

  - quest_code: PERSONAL_Q_CONFRONTER_NAME_CONCERN
    when:
      self.conflict: CONFRONTER
    title: "부드럽게 짚어보기"
    description: "우려되는 부분을 '나는 이렇게 느꼈어'로 시작해서 부드럽게 표현해보세요."
    action: "지적하고 싶은 지점이 있으면 '나는 ~라고 느꼈어' 문장으로 한 번 말해보기"
    tags: [conflict, self]

  - quest_code: PERSONAL_Q_HARMONIZER_STATE_OPINION
    when:
      self.conflict: HARMONIZER
    title: "내 의견도 하나 꺼내기"
    description: "모두의 의견을 조율하는 것도 좋지만, 오늘은 내 생각도 하나 꺼내보세요."
    action: "다른 사람 의견을 조율하기 전에 내 의견을 먼저 한 마디 말해보기"
    tags: [conflict, self]

  - quest_code: PERSONAL_Q_DIRECT_ADD_CONTEXT
    when:
      self.communication: DIRECT
    title: "한 호흡 쉬고 전달하기"
    description: "평소처럼 간결하게 말하되, 배경 설명을 한 문장만 덧붙여보세요."
    action: "결론만 말하기 전에 '왜냐하면'으로 이유 한 문장을 추가해서 말해보기"
    tags: [communication, self]

  - quest_code: PERSONAL_Q_TACTFUL_BE_CLEAR
    when:
      self.communication: TACTFUL
    title: "핵심 먼저 말해보기"
    description: "돌려 말하기 전에, 핵심 결론을 한 문장으로 먼저 던져보세요."
    action: "설명을 시작하기 전에 결론 한 문장을 먼저 말하고 부연설명 이어가기"
    tags: [communication, self]

  - quest_code: PERSONAL_Q_DIRECT_IN_TACTFUL_TEAM
    when:
      self.communication: DIRECT
      team.communication.majority: TACTFUL
    title: "톤 낮춰서 다시 말해보기"
    description: "배려형이 다수인 팀입니다. 하고 싶은 말을 조금 더 부드러운 표현으로 바꿔서 전달해보세요."
    action: "직설적으로 하고 싶은 말을 '~하면 어떨까?' 형태의 질문으로 바꿔서 말해보기"
    tags: [communication, self, team-context]

  - quest_code: PERSONAL_Q_DRIVER_IN_SUPPORTER_TEAM
    when:
      self.agency: DRIVER
      team.agency.majority: SUPPORTER
    title: "속도 확인하고 가기"
    description: "지원형이 다수인 팀입니다. 다음 단계로 넘어가기 전에 팀원들의 준비 상태를 한 번 물어보세요."
    action: "'다음 단계로 넘어가도 될까요?' 라고 팀에게 한 번 확인하고 진행하기"
    tags: [agency, self, team-context]

  - quest_code: PERSONAL_Q_PLANNER_IN_ADAPTER_TEAM
    when:
      self.planning: PLANNER
      team.planning.majority: ADAPTER
    title: "큰 틀만 먼저 공유하기"
    description: "적응형이 다수인 팀입니다. 세부 계획 대신 큰 방향만 먼저 공유해보세요."
    action: "디테일은 잠시 접어두고 '이번 방향은 이거야' 정도만 한 문장으로 공유하기"
    tags: [planning, self, team-context]

  - quest_code: PERSONAL_Q_CONFRONTER_IN_HARMONIZER_TEAM
    when:
      self.conflict: CONFRONTER
      team.conflict.majority: HARMONIZER
    title: "질문형으로 문제 제기하기"
    description: "조화형이 다수인 팀입니다. 직접적인 지적 대신 질문 형태로 문제를 꺼내보세요."
    action: "'이 부분은 이렇게 하는 게 맞을까?' 형태의 질문으로 우려를 표현해보기"
    tags: [conflict, self, team-context]

  - quest_code: PERSONAL_Q_SUPPORTER_IN_DRIVER_TEAM
    when:
      self.agency: SUPPORTER
      team.agency.majority: DRIVER
    title: "안건 하나 미리 등록하기"
    description: "주도형이 다수인 팀입니다. 논의 안건을 하나 미리 준비해서 이번 회의에 제안해보세요."
    action: "회의 시작 전에 다루고 싶은 안건 하나를 미리 팀에 공유해두기"
    tags: [agency, self, team-context]

  - quest_code: PERSONAL_Q_ADAPTER_IN_PLANNER_TEAM
    when:
      self.planning: ADAPTER
      team.planning.majority: PLANNER
    title: "진행 상황 먼저 알리기"
    description: "계획형이 다수인 팀입니다. 완성 전이라도 지금까지 진행한 걸 짧게 공유해보세요."
    action: "완성되지 않았어도 '지금까지 이 정도 진행했어' 라고 중간 공유 한 번 해보기"
    tags: [planning, self, team-context]

  - quest_code: PERSONAL_Q_TACTFUL_IN_DIRECT_TEAM
    when:
      self.communication: TACTFUL
      team.communication.majority: DIRECT
    title: "필요한 것 먼저 말해보기"
    description: "직설형이 다수인 팀입니다. 돌려 말하기 전에 필요한 것을 먼저 짧게 말해보세요."
    action: "'나는 ~가 필요해' 를 논의 초반에 한 번 먼저 말해보기"
    tags: [communication, self, team-context]

  - quest_code: PERSONAL_Q_HARMONIZER_IN_CONFRONTER_TEAM
    when:
      self.conflict: HARMONIZER
      team.conflict.majority: CONFRONTER
    title: "우려 사항 하나 콕 짚기"
    description: "직면형이 다수인 팀입니다. 회의가 끝나기 전에 우려되는 점 하나만 명확히 말해보세요."
    action: "회의 마무리 전 '이 부분은 조금 걱정돼' 라고 우려 하나를 짚어서 말해보기"
    tags: [conflict, self, team-context]
