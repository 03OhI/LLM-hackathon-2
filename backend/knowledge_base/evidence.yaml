# 근거 수준 정의와 표현 가이드
# 규칙마다 다음 중 하나의 근거 수준을 가진다.

levels:
  - level: direct
    description: "해당 행동 특성에 대한 직접적 연구 근거가 있음"
    expression_guide: "~한 경향이 있습니다"
    tone: assertive

  - level: indirect
    description: "관련 특성에 대한 간접적 연구에서 유추 가능"
    expression_guide: "~할 수 있습니다"
    tone: moderate

  - level: limited
    description: "제한적 실험이나 사례 관찰에서 도출"
    expression_guide: "~할 가능성이 있어요"
    tone: tentative

  - level: team_judgment
    description: "팀 내부 기준으로 설정한 규칙 (외부 연구 근거 없음)"
    expression_guide: "팀 내부 기준으로 ~일 수 있어요"
    tone: qualified

# DiSC 연구 활용 경계
disc_research_boundary:
  usage: "팀 내 행동 역할·균형에 관한 일부 조합 규칙의 참고 근거"
  not_for:
    - "자체 설문의 타당도 보증"
    - "팀 성과 예측 보증"
    - "자체 4축 결과를 D/i/S/C로 대응 또는 변환"
    - "D/i/S/C 고른 분포 = 높은 성과 보편 법칙"
