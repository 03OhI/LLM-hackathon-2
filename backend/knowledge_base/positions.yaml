# 4축 성향 포지션 정의
# 자체 4축 모델: planning, agency, conflict, communication
# DiSC 코드(D/i/S/C)와 혼동하지 않는다.

axes:
  - key: planning
    upper: PLANNER
    lower: ADAPTER
    upper_label: "계획형"
    lower_label: "적응형"
    description: "목표 달성을 위한 구조화·사전 준비 성향"
    reference: "Big Five 성실성의 일부 facet 참고"

  - key: agency
    upper: DRIVER
    lower: SUPPORTER
